name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      # The squash-merge title becomes the commit message.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sign-off:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      # Every commit must carry Signed-off-by (see CONTRIBUTING.md, Licensing of contributions).
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_COMMITS: ${{ github.event.pull_request.commits_url }}
        run: |
          missing=$(gh api --paginate "$PR_COMMITS" \
            --jq '.[] | select(.commit.message | test("(?m)^Signed-off-by: .+ <.+>$") | not) | .sha[0:7]')
          if [ -n "$missing" ]; then
            echo "Commits without Signed-off-by: $missing"
            echo "Fix with: git rebase --signoff origin/main && git push --force-with-lease"
            exit 1
          fi
